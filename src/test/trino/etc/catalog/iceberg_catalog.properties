# The catalog is named as in the production stand (iceberg_catalog) so that test URLs
# match the real ones.
#
# Iceberg, not memory: the memory connector rejects DELETE/UPDATE, and Liquibase's
# tracking tables (DATABASECHANGELOGLOCK) cannot initialize without them.
connector.name=iceberg

# Metacatalog is the Apache Iceberg REST fixture from docker-compose.yml.
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/

# REQUIRED: Iceberg format version 2. Row-level DELETE/UPDATE (which Liquibase's
# tracking tables and the fixture's rollbackChangeset rely on) exist only in v2.
iceberg.format-version=2

# Data lives in the S3-compatible silo storage from docker-compose.yml. Trino 464 cannot
# write to a local filesystem (there is no file:// scheme), so there are few options.
fs.native-s3.enabled=true
s3.endpoint=http://silo:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=liquibase
s3.aws-secret-key=liquibase-trino-test
