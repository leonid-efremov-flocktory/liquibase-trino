name: Test

# Tests triggered by a tag: the stand from src/test/trino/docker-compose.yml
# (Trino + Iceberg REST catalog + S3 storage) is brought up, then mvn test runs.
#
# The stand is brought up and torn down by run-tests.sh, the same script a developer runs
# locally, so the readiness handling exists in one place: the Trino healthcheck in the compose
# file runs a real query and `up --wait` blocks on it.
#
# No artifact publishing is needed: consumers (docker/liquibase) pull the plugin
# from JitPack (https://jitpack.io), which builds the repository itself from the
# git tag. jitpack.yml (JDK 17) in the repository root tells JitPack which JDK to use.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check that the version in pom.xml matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM_VERSION=$(mvn -q -Dexec.executable=echo \
            -Dexec.args='${project.version}' --non-recursive \
            org.codehaus.mojo:exec-maven-plugin:3.1.0:exec)
          if [ "$TAG" != "$POM_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the pom.xml version ($POM_VERSION)"
            exit 1
          fi

      # `./run-tests.sh` = up --wait, mvn test, down -v — the same script a developer runs.
      # Trino is reachable on localhost:8081 because compose publishes the port.
      - name: Run tests against the stand
        run: ./run-tests.sh
