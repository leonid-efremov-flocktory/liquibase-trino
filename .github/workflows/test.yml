name: Test

# Tests triggered by a tag: the stand from src/test/trino/docker-compose.yml
# (Trino + Iceberg REST catalog + S3 storage) is brought up, then mvn test runs.
#
# No artifact publishing is needed: consumers (docker/liquibase) pull the plugin
# from JitPack (https://jitpack.io), which builds the repository itself from the
# git tag. jitpack.yml (JDK 17) in the repository root tells JitPack which JDK to use.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check that the version in pom.xml matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM_VERSION=$(mvn -q -Dexec.executable=echo \
            -Dexec.args='${project.version}' --non-recursive \
            org.codehaus.mojo:exec-maven-plugin:3.1.0:exec)
          if [ "$TAG" != "$POM_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the pom.xml version ($POM_VERSION)"
            exit 1
          fi

      - name: Start the stand
        run: docker compose -f src/test/trino/docker-compose.yml up -d --wait

      # Wait for a real query to succeed, not for the /v1/info response: it appears
      # before the catalogs are loaded. Trino does not start until the iceberg_catalog
      # is up, so this polling covers both the Iceberg REST catalog and the S3 storage.
      - name: Wait for Trino to be ready
        run: |
          for _ in $(seq 1 60); do
            if docker exec liquibase-trino-test trino --user smoke --execute "SELECT 1" >/dev/null 2>&1; then
              echo "Trino is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Trino did not become ready in time." >&2
          docker logs --tail 50 liquibase-trino-iceberg-rest >&2 || true
          exit 1

      - name: Run tests
        run: mvn -B test

      - name: Stop the stand
        if: always()
        run: docker compose -f src/test/trino/docker-compose.yml down -v
