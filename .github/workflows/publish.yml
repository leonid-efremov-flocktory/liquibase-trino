name: Publish

# Публикация в GitHub Packages по тегу. Перед deploy обязательно прогоняются тесты:
# поднимается стенд из src/test/trino/docker-compose.yml (Trino + Iceberg REST catalog +
# S3-хранилище), затем выполняется mvn test.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Проверить, что версия в pom.xml совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM_VERSION=$(mvn -q -Dexec.executable=echo \
            -Dexec.args='${project.version}' --non-recursive \
            org.codehaus.mojo:exec-maven-plugin:3.1.0:exec)
          if [ "$TAG" != "$POM_VERSION" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией в pom.xml ($POM_VERSION)"
            exit 1
          fi

      - name: Поднять стенд
        run: docker compose -f src/test/trino/docker-compose.yml up -d --wait

      # Ждём выполнения реального запроса, а не HTTP-ответа /v1/info: он появляется
      # до загрузки каталогов. Trino не стартует, пока не поднимется каталог iceberg_catalog,
      # поэтому этот опрос покрывает и готовность Iceberg REST catalog и S3-хранилища.
      - name: Дождаться готовности Trino
        run: |
          for _ in $(seq 1 60); do
            if docker exec liquibase-trino-test trino --user smoke --execute "SELECT 1" >/dev/null 2>&1; then
              echo "Trino готов."
              exit 0
            fi
            sleep 2
          done
          echo "Trino не поднялся за отведённое время." >&2
          docker logs --tail 50 liquibase-trino-iceberg-rest >&2 || true
          exit 1

      - name: Прогнать тесты
        run: mvn -B test

      - name: Остановить стенд
        if: always()
        run: docker compose -f src/test/trino/docker-compose.yml down -v

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Maven сам токен не подхватывает: GitHub Packages требует credentials для
      # server с id=github (id берётся из distributionManagement в pom.xml).
      - name: Настроить доступ к GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Опубликовать в GitHub Packages
        run: mvn -B deploy